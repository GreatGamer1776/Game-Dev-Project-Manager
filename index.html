<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevArchitect - Project Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Apply every persisted appearance axis before paint to avoid a flash.
      (function () {
        var root = document.documentElement;
        var get = function (key, fallback) {
          try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
        };
        try {
          var stored = localStorage.getItem('devarchitect-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored ? stored === 'dark' : true; // default to dark
          if (stored === 'system') dark = prefersDark;
          root.classList.toggle('dark', dark);
        } catch (e) {
          root.classList.add('dark');
        }
        root.setAttribute('data-scheme', get('devarchitect-scheme', 'indigo'));
        root.setAttribute('data-tint', get('devarchitect-tint', 'neutral'));
        root.setAttribute('data-corners', get('devarchitect-corners', 'precise'));
        root.setAttribute('data-density', get('devarchitect-density', 'comfortable'));
        root.setAttribute('data-type', get('devarchitect-typeface', 'technical'));
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-XlSRCmFc.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C6jBLvLM.css">
  </head>
  <body>
    <div id="root"></div>
</body>
</html>
