services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devarchitect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devarchitect}
      POSTGRES_DB: ${POSTGRES_DB:-devarchitect}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Bound to localhost only — the API reaches Postgres over the internal
    # network; publishing it LAN-wide would expose the DB with default creds.
    # Remove the 127.0.0.1 prefix only if you need remote DB access.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-devarchitect}:${POSTGRES_PASSWORD:-devarchitect}@db:5432/${POSTGRES_DB:-devarchitect}
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    # Localhost-only too — browsers reach the API through the nginx proxy.
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - api
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-4443}
      # Set to "true" when a TLS-terminating reverse proxy (NPM, Caddy,
      # Traefik) fronts the app — the container then serves plain HTTP :80.
      DISABLE_INTERNAL_TLS: ${DISABLE_INTERNAL_TLS:-false}
    ports:
      - "${WEB_PORT:-8080}:80"
      - "${HTTPS_PORT:-4443}:443"
    # Optional: real certs (server.crt + server.key) replace the self-signed one.
    # volumes:
    #   - /path/to/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
