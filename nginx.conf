# HTTP -> HTTPS redirect. ${HTTPS_PORT} is substituted by the nginx
# entrypoint (envsubst) at container start; nginx vars ($host etc.) are
# left untouched.
server {
  listen 80;
  server_name _;
  return 301 https://$host:${HTTPS_PORT}$request_uri;
}

server {
  listen 443 ssl;
  server_name _;

  ssl_certificate /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
